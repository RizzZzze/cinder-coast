<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinder Coast — Port Calida</title>
<link rel="stylesheet" href="styles/main.css">
<script>window.CinderCoast = window.CinderCoast || {};</script>
</head>
<body>
<div id="game"></div>
<div id="damage-flash"></div>
<div id="hud">
  <div id="top-left">
    <div id="clock">17:30</div>
    <div id="stars"></div>
    <div id="objective-line">Free roam — Port Calida</div>
    <div id="objective-dist"></div>
    <div id="progress-wrap"><div id="progress-fill"></div></div>
  </div>
  <div id="top-right">
    <div id="cash">800 crowns</div>
    <div id="standing">Standing 0 · Chapter 1</div>
  </div>
  <div id="feed"></div>
  <div id="bottom-left">
    <canvas id="minimap" width="180" height="180"></canvas>
    <div id="bars">
      <div class="bar"><div id="health-fill"></div></div>
      <div class="bar"><div id="armour-fill"></div></div>
      <div id="health-label">Health 100 · Armour 25</div>
    </div>
  </div>
  <div id="bottom-right">
    <div id="ammo">Kestrel 9 12 / 24</div>
  </div>
  <div id="speedometer">0 km/h <span id="gear"></span><div class="bar"><div id="damage-bar"></div></div></div>
  <div id="prompt"></div>
  <div id="crosshair">+</div>
  <div id="hitmarker">✕</div>
</div>
<div id="screens"></div>

<script src="vendor/three/three.min.js"></script>
<script src="js/util/rng.js"></script>
<script src="js/util/geometry.js"></script>
<script src="js/util/spatial.js"></script>
<script src="js/config.js"></script>
<script src="js/world/districts.js"></script>
<script src="js/world/city.js"></script>
<script src="js/world/chunks.js"></script>
<script src="js/world/props.js"></script>
<script src="js/world/sky.js"></script>
<script src="js/traffic/lights.js"></script>
<script src="js/traffic/traffic.js"></script>
<script src="js/people/pedestrians.js"></script>
<script src="js/player/camera.js"></script>
<script src="js/player/player.js"></script>
<script src="js/player/input.js"></script>
<script src="js/vehicles/vehicles.js"></script>
<script src="js/vehicles/driving.js"></script>
<script src="js/vehicles/ownership.js"></script>
<script src="js/police/wanted.js"></script>
<script src="js/police/police.js"></script>
<script src="js/combat/weapons.js"></script>
<script src="js/combat/enemies.js"></script>
<script src="js/combat/damage.js"></script>
<script src="js/missions/story.js"></script>
<script src="js/missions/missions.js"></script>
<script src="js/missions/activities.js"></script>
<script src="js/missions/progression.js"></script>
<script src="js/save/save.js"></script>
<script src="js/ui/notify.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/ui/minimap.js"></script>
<script src="js/ui/menu.js"></script>
<script src="js/fx/effects.js"></script>
<script src="js/fx/quality.js"></script>
<script src="js/audio/audio.js"></script>
<script src="js/audio/music.js"></script>
<script src="js/audio/sfx.js"></script>
<script src="js/main.js"></script>
</body>
</html>
